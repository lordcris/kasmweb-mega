services:
  kasm:
    image: lordcris/kasmweb-mega:latest
    pull_policy: always
    shm_size: "512m"
    environment:
      # No VNC login: access is protected by Cloudflare Access in front of the tunnel.
      - VNCOPTIONS=-disableBasicAuth
    expose:
      - "6901"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    depends_on:
      - kasm
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
